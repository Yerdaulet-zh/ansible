---
# Install the plugin that provides needs-restarting on supported systems
- name: Ensure DNF plugins are installed
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

# Upgrade packages; report failures without attempting an unsafe rollback
- name: Upgrade packages on RHEL-family systems
  block:
    - name: Update all installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: dnf_upgrade_result

  rescue:
    - name: Report DNF upgrade failure
      ansible.builtin.debug:
        msg: >-
          DNF upgrade failed on {{ inventory_hostname }}.
          Review the task output and DNF logs.
          Automatic package rollback was not attempted.

    - name: Fail the patching workflow
      ansible.builtin.fail:
        msg: >-
          OS patching failed on {{ inventory_hostname }}.
          Manual investigation or an approved recovery procedure is required.

# Check whether a reboot is required
- name: Check whether a reboot is required
  ansible.builtin.command:
    argv:
      - needs-restarting
      - -r
  register: reboot_check
  changed_when: false

  # Exit 0 means no reboot is recommended; 1 means a reboot is recommended.
  # Other exit codes indicate an error that must not be silently ignored.
  failed_when: reboot_check.rc not in [0, 1]

# Reboot only when the command recommends it
- name: Reboot the server when required
  ansible.builtin.reboot:
    msg: "Rebooting after OS patching"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: reboot_check.rc == 1
