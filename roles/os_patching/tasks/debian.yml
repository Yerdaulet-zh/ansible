---
- block:
    - name: Capture installed package versions before upgrade
      ansible.builtin.shell: dpkg-query -W -f='${Package}=${Version}\n'
      register: pre_upgrade_packages
      changed_when: false

    - name: Upgrade all packages safely
      ansible.builtin.apt:
        update_cache: yes
        upgrade: safe
      register: apt_upgrade_result

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot server if kernel update requires it
      ansible.builtin.reboot:
        msg: "Rebooting machine by Ansible os_patching role due to kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
      when: reboot_required_file.stat.exists

  rescue:
    - name: Upgrade failed! Attempting package version rollback...
      ansible.builtin.debug:
        msg: "An error occurred during package upgrades. Reverting packages to pre-upgrade snapshot."

    - name: Rollback packages to previous versions
      ansible.builtin.apt:
        name: "{{ pre_upgrade_packages.stdout_lines }}"
        state: present
        allow_downgrade: true
      ignore_errors: false

    - name: Fail playbook after rollback attempt
      ansible.builtin.fail:
        msg: "Patching failed on {{ ansible_hostname }}. Rollback sequence executed."
