---
- name: Maintain Kubernetes node
  block:
    # Cordon and drain before patching
    - name: Cordon and drain node
      ansible.builtin.include_tasks: cordon-drain.yml
      when: enable_k8s_drain

    # Run OS-specific patching
    - name: Run Debian patching workflow
      ansible.builtin.include_tasks: debian.yml
      when: ansible_facts['os_family'] | lower == 'debian'

    - name: Run RedHat patching workflow
      ansible.builtin.include_tasks: rhel.yml
      when: ansible_facts['os_family'] | lower == 'redhat'

  rescue:
    # Record that maintenance failed
    - name: Record maintenance failure
      ansible.builtin.set_fact:
        maintenance_failed: true

    # Report the failure to CI/CD logs
    - name: Report maintenance failure
      ansible.builtin.debug:
        msg: >-
          Maintenance failed on {{ inventory_hostname }}.
          The node will remain cordoned until recovery and
          health checks confirm that it is safe to restore.

  always:
    # Only attempt automatic restoration after successful maintenance.
    # Failed maintenance requires a separate recovery decision.
    - name: Restore Kubernetes node
      ansible.builtin.include_tasks: uncordon.yml
      when:
        - enable_k8s_drain
        - not (maintenance_failed | default(false))
