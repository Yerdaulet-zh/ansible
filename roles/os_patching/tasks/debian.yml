---
- name: Upgrade installed packages
  block:
    - name: Refresh APT cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
      register: apt_upgrade_result

  rescue:
    - name: Report package upgrade failure
      ansible.builtin.debug:
        msg: >-
          APT upgrade failed on {{ inventory_hostname }}.
          Review the APT logs and determine whether any
          packages were partially upgraded.

    # Keep the failure visible to the pipeline
    - name: Fail the patching operation
      ansible.builtin.fail:
        msg: >-
          Package upgrade failed on {{ inventory_hostname }}.
          Automatic package rollback was not attempted.
          Manual investigation or an approved recovery procedure
          is required.

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot server if required
  ansible.builtin.reboot:
    msg: "Rebooting after OS patching"
    connect_timeout: 5
    reboot_timeout: 300
  when: reboot_required_file.stat.exists
